name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main", "claude/garden-shed-docs-n7eq2b"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Installer les dépendances
        run: npm ci
      - name: Build app (esbuild) + génération des artefacts (params.js, SVG)
        run: |
          npm run build
          npm run build:cli
          node scripts/build.mjs --emit
      - name: Tests (snapshots golden + smoke DOM)
        # test:raw = the runner itself; `npm test` goes through shipkit, absent on CI
        run: npm run test:raw
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (dossier site/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
