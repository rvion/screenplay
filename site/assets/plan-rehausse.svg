<text x="370.4" y="26.0" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">Rehausse · 1 panneau 240 × 100 cm → 2 triangles + 1 bandeau</text>
<text x="370.4" y="208.0" text-anchor="middle" fill="#888" font-size="11" font-weight="normal">toutes coupes droites + une seule diagonale · le triangle D est le même que G, tourné de 180°</text>
