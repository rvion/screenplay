<text x="306.0" y="86.5" text-anchor="start" fill="#a07400" font-size="11" font-weight="normal">bande 1 : 240 × 25, coupée en diagonale = triangle G + triangle D</text>
<text x="306.0" y="119.5" text-anchor="start" fill="#2b5d8a" font-size="11" font-weight="normal">bande 2 : bandeau avant 200 × 25</text>
